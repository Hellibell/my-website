<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3A1TR — Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* ── ตัวแปรสีโทนม่วง-ชมพู Galaxy Violet ── */
  :root {
    --bg: #0a0510;
    --accent: #c450ff;
    --accent2: #ff80c8;
    --glass-border: rgba(196, 80, 255, 0.2);
    --text: #f5e8ff;
    --muted: #8855aa;
    --online: #c450ff;
    --card-bg: rgba(20, 8, 35, 0.75);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'Oxanium', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ── Canvas พื้นหลัง ── */
  #bgCanvas {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
  }

  /* ── Layout หลัก จัดกึ่งกลางหน้าจอ ── */
  .page {
    position: relative; z-index: 10;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── การ์ดโปรไฟล์หลัก ── */
  .profile-card {
    background: var(--card-bg);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 40px 44px;
    width: 420px;
    backdrop-filter: blur(24px);
    box-shadow: 0 20px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(196,80,255,0.05) inset;
    position: relative;
  }

  /* เส้นไฟด้านบนการ์ด */
  .profile-card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  /* ── Animations ── */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── ส่วนหัวโปรไฟล์ ── */
  .profile-header {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
  }

  /* กรอบรูป avatar */
  .avatar-wrap { position: relative; flex-shrink: 0; }

  /* วงแหวนหมุนรอบ avatar โทนม่วง-ชมพู */
  .avatar-ring {
    position: absolute; inset: -5px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    background: conic-gradient(var(--accent2), var(--accent), var(--accent2)) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
    animation: spinRing 6s linear infinite;
  }
  @keyframes spinRing { to { transform: rotate(360deg); } }

  /* รูปโปรไฟล์ GIF */
  .avatar-inner {
    width: 80px; height: 80px;
    border-radius: 50%;
    display: block;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* ดาวประกายมุมบนขวา */
  .sparkle-badge {
    position: absolute;
    top: -4px; right: -4px;
    color: var(--accent);
    font-size: 18px;
    filter: drop-shadow(0 0 6px var(--accent));
    animation: sparklePop 3s ease-in-out infinite;
  }
  @keyframes sparklePop {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
    50%       { transform: scale(1.3) rotate(20deg); opacity: 1; }
  }

  /* ข้อมูลโปรไฟล์ */
  .profile-info { flex: 1; padding-top: 4px; }

  /* ชื่อผู้ใช้ */
  .profile-name {
    font-size: 26px; font-weight: 700;
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 8px;
    line-height: 1; margin-bottom: 6px;
  }

  /* แท็กงานอดิเรก */
  .profile-tags {
    font-size: 12px; color: var(--muted);
    font-family: 'Space Mono', monospace; line-height: 1.6;
  }
  .profile-tags span { color: rgba(255,255,255,0.25); }

  /* ── เส้นคั่น ── */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
    margin: 20px 0;
  }

  /* ── ปุ่มโซเชียลมีเดีย ── */
  .social-links {
    display: flex; gap: 12px;
    justify-content: center; margin-bottom: 22px;
  }
  .social-btn {
    width: 40px; height: 40px; border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.03);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.25s;
    color: var(--muted); text-decoration: none;
  }
  .social-btn svg { width: 18px; height: 18px; fill: currentColor; transition: fill 0.25s; }
  .social-btn:hover { transform: translateY(-2px); }

  /* Hover สีของแต่ละแพลตฟอร์ม */
  .social-btn[title="Facebook"]:hover  { border-color:#1877F2; color:#1877F2; background:rgba(24,119,242,0.1);  box-shadow:0 0 14px rgba(24,119,242,0.3);  }
  .social-btn[title="Instagram"]:hover { border-color:#E1306C; color:#E1306C; background:rgba(225,48,108,0.1);  box-shadow:0 0 14px rgba(225,48,108,0.3);  }
  .social-btn[title="Discord"]:hover   { border-color:#5865F2; color:#5865F2; background:rgba(88,101,242,0.1);  box-shadow:0 0 14px rgba(88,101,242,0.3);  }
  .social-btn[title="Spotify"]:hover   { border-color:#1DB954; color:#1DB954; background:rgba(29,185,84,0.1);   box-shadow:0 0 14px rgba(29,185,84,0.3);   }
  .social-btn[title="Roblox"]:hover    { border-color:#e00;    color:#e00;    background:rgba(238,0,0,0.1);     box-shadow:0 0 14px rgba(238,0,0,0.3);     }

  /* ── แผงสถานะระบบ ── */
  .status-panel {
    background: rgba(10,3,20,0.6);
    border: 1px solid var(--glass-border);
    border-radius: 14px; padding: 16px 18px;
  }
  .status-header {
    font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted);
    font-family: 'Space Mono', monospace; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* ไฟบอกสถานะออนไลน์ */
  .online-indicator { display: flex; align-items: center; gap: 5px; color: var(--accent); font-size: 10px; }
  .online-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1);   }
    50%       { opacity: 0.4; transform: scale(0.7); }
  }

  /* แถวข้อมูลในแผงสถานะ */
  .status-row {
    display: flex; justify-content: space-between;
    align-items: center; padding: 5px 0; font-size: 12px;
  }
  .status-row + .status-row {
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 4px; padding-top: 9px;
  }
  .status-key  { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; }
  .status-val  { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; }
  .status-val.mono { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.18em; }

  /* ── เครดิตด้านล่าง ── */
  .page-credit {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    font-family: 'Space Mono', monospace; font-size: 10px;
    color: rgba(255,255,255,0.15); letter-spacing: 0.1em; z-index: 20;
  }

  /* ── Card float animation ── */
  .profile-card {
    animation: cardIn 1s cubic-bezier(0.16,1,0.3,1) both 0.1s, cardFloat 6s ease-in-out 1.2s infinite;
  }
  @keyframes cardFloat {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-8px); }
  }

  /* ── Glitch Effect บนชื่อ ── */
  .profile-name {
    position: relative;
    cursor: default;
  }
  .glitch-text {
    position: relative;
    display: inline-block;
  }
  .glitch-text::before,
  .glitch-text::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    pointer-events: none;
  }
  .glitch-text:hover::before {
    animation: glitch1 0.3s steps(2) infinite;
    color: var(--accent2);
    clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
    opacity: 1;
    left: -2px;
  }
  .glitch-text:hover::after {
    animation: glitch2 0.3s steps(2) infinite;
    color: var(--accent);
    clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
    opacity: 1;
    left: 2px;
  }
  @keyframes glitch1 {
    0%  { transform: translate(-2px, 1px) skewX(2deg); }
    50% { transform: translate(2px, -1px) skewX(-3deg); }
  }
  @keyframes glitch2 {
    0%  { transform: translate(2px, -1px) skewX(-2deg); }
    50% { transform: translate(-2px, 1px) skewX(3deg); }
  }

  /* ── Holographic shimmer บน status panel ── */
  .status-panel {
    position: relative;
    overflow: hidden;
  }
  .status-panel::after {
    content: '';
    position: absolute;
    top: -50%; left: -60%;
    width: 40%; height: 200%;
    background: linear-gradient(105deg,
      transparent 40%,
      rgba(196,80,255,0.08) 50%,
      rgba(255,128,200,0.12) 55%,
      transparent 65%
    );
    animation: holoShimmer 4s linear infinite;
    pointer-events: none;
  }
  @keyframes holoShimmer {
    0%   { left: -60%; }
    100% { left: 130%; }
  }

  /* ── Social button ripple ── */
  .social-btn {
    position: relative;
    overflow: hidden;
  }
  .social-btn .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(196,80,255,0.35);
    transform: scale(0);
    animation: rippleOut 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes rippleOut {
    to { transform: scale(4); opacity: 0; }
  }

  /* ── Cursor trail canvas ── */
  #trailCanvas {
    position: fixed; inset: 0; z-index: 5;
    pointer-events: none;
    width: 100%; height: 100%;
  }

  /* ── Tag typewriter cursor ── */
  .tag-cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--accent);
    vertical-align: middle;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  /* ── Online dot rainbow pulse ── */
  .online-dot {
    animation: pulse 2s ease-in-out infinite, dotColor 6s linear infinite;
  }
  @keyframes dotColor {
    0%   { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    33%  { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
    66%  { background: #80ffe8; box-shadow: 0 0 8px #80ffe8; }
    100% { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  }

  /* ── Avatar ring color shift ── */
  @keyframes spinRing { to { transform: rotate(360deg); } }
  .avatar-ring {
    animation: spinRing 6s linear infinite, ringColor 8s linear infinite;
  }
  @keyframes ringColor {
    0%   { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }
  
 .const bgs = [
  "assets/svg-bg/bg-1.svg",
  "assets/svg-bg/bg-2.svg",
  "assets/svg-bg/bg-3.svg",
  "assets/svg-bg/bg-4.svg"
];

let index = 0;
const bg = document.getElementById("bgSVG");

function changeBg() {
  bg.src = bgs[index];
  index = (index + 1) % bgs.length;
}

changeBg();
setInterval(changeBg, 5000);
</script>
</body>
</style>

<script>
  /* ─────────────────────────────────────────
     ฟังก์ชัน: อัปเดตนาฬิกาแบบเรียลไทม์
     แสดงเวลา HH:MM:SS ทุก 1 วินาที
     ───────────────────────────────────────── */
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ─────────────────────────────────────────
     ตั้งค่า Canvas พื้นหลัง
     ───────────────────────────────────────── */
  const canvas = document.getElementById('bgCanvas');
  const ctx    = canvas.getContext('2d');
  let W, H, mouse = { x: 0.5, y: 0.5 };

  /* ฟังก์ชัน: ปรับขนาด Canvas ให้เต็มหน้าจอ */
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  /* ติดตามตำแหน่งเมาส์เพื่อทำ parallax */
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX / W;
    mouse.y = e.clientY / H;
  });

  /* ─────────────────────────────────────────
     สร้างดาว 280 ดวงแบบสุ่ม โทนม่วง-ชมพู
     ───────────────────────────────────────── */
  const STAR_COUNT = 280;
  const stars = Array.from({ length: STAR_COUNT }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.4 + 0.3,
    speed: Math.random() * 0.00008 + 0.00002,
    twinkleOffset: Math.random() * Math.PI * 2,
    twinkleSpeed:  Math.random() * 0.02 + 0.005,
    /* สีม่วง ชมพู หรือขาวนวล */
    color: Math.random() < 0.2
      ? `hsl(${300 + Math.random()*40},80%,85%)`
      : Math.random() < 0.4
        ? `hsl(${260 + Math.random()*30},70%,80%)`
        : `hsl(${280 + Math.random()*40},50%,${80 + Math.random()*20}%)`,
  }));

  /* ─────────────────────────────────────────
     ระบบดาวตก: เก็บดาวตกใน array
     ───────────────────────────────────────── */
  const shooters = [];

  /* ฟังก์ชัน: สร้างดาวตกใหม่แบบสุ่ม */
  function spawnShooter() {
    shooters.push({
      x:     Math.random() * W,
      y:     Math.random() * H * 0.5,
      vx:    (Math.random() * 4 + 3) * (Math.random() < 0.5 ? 1 : -1),
      vy:    Math.random() * 2 + 1,
      len:   Math.random() * 120 + 60,
      alpha: 1,
      fade:  Math.random() * 0.015 + 0.01,
    });
  }
  /* สร้างดาวตกทุก ~3-5 วินาที */
  setInterval(spawnShooter, 2800 + Math.random() * 2000);

  /* ─────────────────────────────────────────
     หมอกอวกาศ (Nebula) โทนม่วง-ชมพู 4 จุด
     ───────────────────────────────────────── */
  const nebulae = [
    { x: 0.18, y: 0.28, rx: 0.32, ry: 0.22, color: 'rgba(120,20,180,0.18)' },
    { x: 0.78, y: 0.65, rx: 0.28, ry: 0.20, color: 'rgba(200,40,120,0.15)' },
    { x: 0.50, y: 0.10, rx: 0.50, ry: 0.15, color: 'rgba(100,0,160,0.16)'  },
    { x: 0.30, y: 0.85, rx: 0.25, ry: 0.12, color: 'rgba(180,20,100,0.14)' },
  ];

  /* ข้อมูลดวงจันทร์ */
  const moon = { baseX: 0.88, baseY: 0.09, r: 46 };

  /* ตัวนับเฟรม */
  let t = 0;

  /* ─────────────────────────────────────────
     ฟังก์ชัน: วาดหมอกอวกาศ (Nebula)
     มี parallax เบาๆ ตามเมาส์
     ───────────────────────────────────────── */
  function drawNebulae() {
    nebulae.forEach(n => {
      const px  = n.x + (mouse.x - 0.5) * 0.012;
      const py  = n.y + (mouse.y - 0.5) * 0.012;
      const grd = ctx.createRadialGradient(px*W, py*H, 0, px*W, py*H, n.rx*W);
      grd.addColorStop(0, n.color);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.ellipse(px*W, py*H, n.rx*W, n.ry*H, 0, 0, Math.PI*2);
      ctx.fill();
    });
  }

  /* ─────────────────────────────────────────
     ฟังก์ชัน: วาดดวงจันทร์
     glow สีม่วง, พื้นผิว gradient, หลุมบนดวงจันทร์
     มี parallax ตามเมาส์
     ───────────────────────────────────────── */
  function drawMoon() {
    const mx = moon.baseX * W + (mouse.x - 0.5) * -18;
    const my = moon.baseY * H + (mouse.y - 0.5) * -10;
    const glowPulse = 1 + 0.08 * Math.sin(t * 0.4);

    /* outer glow สีม่วง */
    let g = ctx.createRadialGradient(mx, my, moon.r*0.8, mx, my, moon.r*3.5*glowPulse);
    g.addColorStop(0,   'rgba(196,80,255,0.2)');
    g.addColorStop(0.5, 'rgba(160,60,220,0.08)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(mx, my, moon.r*3.5*glowPulse, 0, Math.PI*2);
    ctx.fill();

    /* ตัวดวงจันทร์โทนม่วงอ่อน */
    let body = ctx.createRadialGradient(mx-moon.r*0.25, my-moon.r*0.25, moon.r*0.05, mx, my, moon.r);
    body.addColorStop(0,    '#f0eaff');
    body.addColorStop(0.45, '#d0b8f0');
    body.addColorStop(1,    '#9060c0');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(mx, my, moon.r, 0, Math.PI*2);
    ctx.fill();

    /* หลุมบนพื้นผิวดวงจันทร์ */
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle   = 'rgba(80,40,120,0.5)';
    [
      [mx - moon.r*0.28, my - moon.r*0.18, 6],
      [mx + moon.r*0.22, my + moon.r*0.08, 8],
      [mx - moon.r*0.05, my + moon.r*0.30, 5],
    ].forEach(([cx, cy, cr]) => {
      ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  /* ─────────────────────────────────────────
     ฟังก์ชัน: วาดดาวทั้งหมด
     กระพริบตาม sine wave, ดาวใหญ่มี glow
     มี parallax เบาๆ ตามเมาส์
     ───────────────────────────────────────── */
  function drawStars() {
    stars.forEach(s => {
      const px      = (s.x + (mouse.x - 0.5) * s.r * 0.015 * 0.5 + 1) % 1;
      const py      = (s.y + s.speed * t + 1) % 1;
      const twinkle = 0.55 + 0.45 * Math.sin(t * s.twinkleSpeed + s.twinkleOffset);

      /* glow สำหรับดาวขนาดใหญ่ */
      if (s.r > 1.1) {
        const grd = ctx.createRadialGradient(px*W, py*H, 0, px*W, py*H, s.r*3);
        grd.addColorStop(0, s.color.replace(')', `,${twinkle*0.6})`).replace('hsl', 'hsla'));
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(px*W, py*H, s.r*3, 0, Math.PI*2);
        ctx.fill();
      }

      /* วาดตัวดาว */
      ctx.globalAlpha = twinkle;
      ctx.fillStyle   = s.color;
      ctx.beginPath();
      ctx.arc(px*W, py*H, s.r, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  /* ─────────────────────────────────────────
     ฟังก์ชัน: วาดดาวตก
     trail แบบ gradient สีชมพู-ม่วง จางออก
     ลบดาวตกที่จางหมดออกจาก array
     ───────────────────────────────────────── */
  function drawShooters() {
    for (let i = shooters.length - 1; i >= 0; i--) {
      const s     = shooters[i];
      const angle = Math.atan2(s.vy, s.vx);
      const tx    = s.x - Math.cos(angle) * s.len;
      const ty    = s.y - Math.sin(angle) * s.len;

      /* trail สีชมพู-ม่วง */
      const grd = ctx.createLinearGradient(tx, ty, s.x, s.y);
      grd.addColorStop(0, 'rgba(255,255,255,0)');
      grd.addColorStop(1, `rgba(220,160,255,${s.alpha})`);

      ctx.strokeStyle = grd;
      ctx.lineWidth   = 1.5;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();

      s.x     += s.vx;
      s.y     += s.vy;
      s.alpha -= s.fade;

      /* ลบเมื่อจางหมด */
      if (s.alpha <= 0) shooters.splice(i, 1);
    }
  }

  /* ─────────────────────────────────────────
     ฟังก์ชัน: Loop หลักของ Canvas (~60fps)
     วาด: พื้นหลัง → nebula → ดวงจันทร์ → ดาว → ดาวตก
     ───────────────────────────────────────── */
  function loop() {
    t++;
    ctx.clearRect(0, 0, W, H);

    /* พื้นหลังสีดำ-ม่วงเข้ม */
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0,   '#050008');
    sky.addColorStop(0.4, '#0a0510');
    sky.addColorStop(1,   '#0d0618');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    drawNebulae();  /* หมอกอวกาศ */
    drawMoon();     /* ดวงจันทร์  */
    drawStars();    /* ดาว        */
    drawShooters(); /* ดาวตก      */

    requestAnimationFrame(loop);
  }

  /* เริ่ม animation loop */
  loop();

  /* ─────────────────────────────────────────
     Cursor Trail — ประกายดาวตามเมาส์
     ───────────────────────────────────────── */
  const trail = document.getElementById('trailCanvas');
  const tCtx  = trail.getContext('2d');
  let tW, tH;
  function resizeTrail() { tW = trail.width = window.innerWidth; tH = trail.height = window.innerHeight; }
  resizeTrail();
  window.addEventListener('resize', resizeTrail);

  const sparks = [];
  window.addEventListener('mousemove', e => {
    for (let i = 0; i < 3; i++) {
      sparks.push({
        x: e.clientX, y: e.clientY,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2 - 1,
        life: 1,
        r: Math.random() * 2.5 + 0.5,
        hue: 270 + Math.random() * 60,
      });
    }
  });

  function trailLoop() {
    tCtx.clearRect(0, 0, tW, tH);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x  += s.vx; s.y  += s.vy; s.vy += 0.05;
      s.life -= 0.035;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      tCtx.globalAlpha = s.life;
      tCtx.fillStyle   = `hsl(${s.hue},100%,75%)`;
      tCtx.beginPath();
      tCtx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2);
      tCtx.fill();
    }
    tCtx.globalAlpha = 1;
    requestAnimationFrame(trailLoop);
  }
  trailLoop();

  /* ─────────────────────────────────────────
     Social Button Ripple เมื่อคลิก
     ───────────────────────────────────────── */
  document.querySelectorAll('.social-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const r   = document.createElement('span');
      r.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
      btn.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
    });
  });

  /* ─────────────────────────────────────────
     Typewriter สำหรับ tags
     ───────────────────────────────────────── */
  (function() {
    const tags = ['ฟังเพลง•เล่นเกมส์•ดูหนัง•คลั่งรัก'];
    const container = document.getElementById('profileTags');
    const cursor    = container.querySelector('.tag-cursor');
    let built = '';
    let tagIdx = 0, charIdx = 0;
    let phase  = 'typing'; // typing | pause | deleting
    let wait   = 0;

    function tick() {
      if (phase === 'typing') {
        if (charIdx < tags[tagIdx].length) {
          built += tags[tagIdx][charIdx++];
        } else {
          phase = 'pause'; wait = 40;
        }
      } else if (phase === 'pause') {
        if (--wait <= 0) phase = 'deleting';
      } else {
        if (charIdx > 0) {
          built = built.slice(0, --charIdx);
        } else {
          tagIdx = (tagIdx + 1) % tags.length;
          phase  = 'typing';
        }
      }
      container.textContent = built + ' ';
      container.appendChild(cursor);
      setTimeout(tick, phase === 'typing' ? 80 : phase === 'deleting' ? 50 : 20);
    }
    setTimeout(tick, 800);
    
  }
  #bgSVG {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
  
})();
</script>
</body>
</html>
