<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3A1TR — Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050d1a;
    --accent: #3af0ff;
    --accent2: #ff4d6d;
    --glass: rgba(10, 30, 60, 0.55);
    --glass-border: rgba(58, 240, 255, 0.15);
    --text: #e8f4ff;
    --muted: #6a8aaa;
    --online: #3dff8f;
    --card-bg: rgba(8, 20, 45, 0.72);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'Oxanium', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ── Canvas BG ── */
  #bgCanvas {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
  }

  /* ── Layout ── */
  .page {
    position: relative; z-index: 10;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Main Profile Card ── */
  .profile-card {
    background: var(--card-bg);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 40px 44px;
    width: 420px;
    backdrop-filter: blur(24px);
    box-shadow: 0 20px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(58,240,255,0.05) inset;
    animation: cardIn 1s cubic-bezier(0.16,1,0.3,1) both 0.1s;
    position: relative;
  }
  .profile-card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Avatar section */
  .profile-header {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
  }

  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .avatar-ring {
    position: absolute; inset: -5px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    background: conic-gradient(var(--accent2), var(--accent), var(--accent2)) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
    animation: spinRing 6s linear infinite;
  }
  @keyframes spinRing {
    to { transform: rotate(360deg); }
  }
  .avatar {
    width: 80px; height: 80px;
    border-radius: 50%;
    object-fit: cover;
    background: linear-gradient(135deg, #0a2040, #1a4080);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    overflow: hidden;
    position: relative;
  }
  .avatar-inner {
    width: 80px; height: 80px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .avatar-inner::after {
    display: none;
  }

  /* Sparkle badge */
  .sparkle-badge {
    position: absolute;
    top: -4px; right: -4px;
    color: var(--accent);
    font-size: 18px;
    filter: drop-shadow(0 0 6px var(--accent));
    animation: sparklePop 3s ease-in-out infinite;
  }
  @keyframes sparklePop {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
    50% { transform: scale(1.3) rotate(20deg); opacity: 1; }
  }

  /* Alert badge */
  .alert-badge {
    position: absolute;
    bottom: 0; left: -2px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    color: #111;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    border: 2px solid var(--bg);
    box-shadow: 0 0 10px rgba(0,0,0,0.4);
  }

  .profile-info { flex: 1; padding-top: 4px; }
  .profile-name {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1;
    margin-bottom: 6px;
  }
  .badge-heart {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent2);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px;
  }
  .badge-circle {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.6;
  }
  .profile-tags {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    line-height: 1.6;
  }
  .profile-tags span { color: rgba(255,255,255,0.35); }

  /* Divider */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
    margin: 20px 0;
  }

  /* Social links */
  .social-links {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 22px;
  }
  .social-btn {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.25s;
    color: var(--muted);
    text-decoration: none;
  }
  .social-btn svg { width: 18px; height: 18px; fill: currentColor; transition: fill 0.25s; }

  .social-btn:hover { transform: translateY(-2px); }

  /* Facebook */
  .social-btn[title="Facebook"]:hover { border-color:#1877F2; color:#1877F2; background:rgba(24,119,242,0.1); box-shadow:0 0 14px rgba(24,119,242,0.3); }
  /* Instagram */
  .social-btn[title="Instagram"]:hover { border-color:#E1306C; color:#E1306C; background:rgba(225,48,108,0.1); box-shadow:0 0 14px rgba(225,48,108,0.3); }
  /* Discord */
  .social-btn[title="Discord"]:hover { border-color:#5865F2; color:#5865F2; background:rgba(88,101,242,0.1); box-shadow:0 0 14px rgba(88,101,242,0.3); }
  /* Spotify */
  .social-btn[title="Spotify"]:hover { border-color:#1DB954; color:#1DB954; background:rgba(29,185,84,0.1); box-shadow:0 0 14px rgba(29,185,84,0.3); }
  /* Roblox */
  .social-btn[title="Roblox"]:hover { border-color:#e00; color:#e00; background:rgba(238,0,0,0.1); box-shadow:0 0 14px rgba(238,0,0,0.3); }

  /* System Status */
  .status-panel {
    background: rgba(5, 15, 35, 0.6);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .status-header {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .online-indicator {
    display: flex; align-items: center; gap: 5px;
    color: var(--online); font-size: 10px;
  }
  .online-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--online);
    box-shadow: 0 0 8px var(--online);
    animation: pulse 2s ease-in-out infinite;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-size: 12px;
  }
  .status-row + .status-row {
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 4px;
    padding-top: 9px;
  }
  .status-key { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 11px; }
  .status-val { font-weight: 600; letter-spacing: 0.05em; }
  .status-val.mono { font-family: 'Space Mono', monospace; font-size: 11px; }

  /* Bottom credits */
  .page-credit {
    position: fixed;
    bottom: 22px; left: 50%; transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.1em;
    z-index: 20;
  }
</style>

<script>
  // ── Clock ──
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── Canvas Background ──
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');

  let W, H, mouse = { x: 0.5, y: 0.5 };

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX / W;
    mouse.y = e.clientY / H;
  });

  // ── Stars ──
  const STAR_COUNT = 280;
  const stars = Array.from({ length: STAR_COUNT }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.4 + 0.3,
    speed: Math.random() * 0.00008 + 0.00002,
    twinkleOffset: Math.random() * Math.PI * 2,
    twinkleSpeed: Math.random() * 0.02 + 0.005,
    color: Math.random() < 0.15
      ? `hsl(${200 + Math.random()*40},80%,85%)`
      : `hsl(${210 + Math.random()*30},50%,${80 + Math.random()*20}%)`,
  }));

  // ── Shooting Stars ──
  const shooters = [];
  function spawnShooter() {
    shooters.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.5,
      vx: (Math.random() * 4 + 3) * (Math.random() < 0.5 ? 1 : -1),
      vy: Math.random() * 2 + 1,
      len: Math.random() * 120 + 60,
      alpha: 1,
      fade: Math.random() * 0.015 + 0.01,
    });
  }
  setInterval(spawnShooter, 2800 + Math.random() * 2000);

  // ── Nebula blobs ──
  const nebulae = [
    { x: 0.18, y: 0.28, rx: 0.32, ry: 0.22, color: 'rgba(20,60,160,0.18)' },
    { x: 0.78, y: 0.65, rx: 0.28, ry: 0.20, color: 'rgba(10,30,100,0.22)' },
    { x: 0.50, y: 0.10, rx: 0.50, ry: 0.15, color: 'rgba(0,50,130,0.16)' },
    { x: 0.30, y: 0.85, rx: 0.25, ry: 0.12, color: 'rgba(5,20,80,0.20)'  },
  ];

  // ── Moon ──
  const moon = { baseX: 0.88, baseY: 0.09, r: 46 };

  let t = 0;

  function drawNebulae() {
    nebulae.forEach(n => {
      const px = n.x + (mouse.x - 0.5) * 0.012;
      const py = n.y + (mouse.y - 0.5) * 0.012;
      const grd = ctx.createRadialGradient(
        px * W, py * H, 0,
        px * W, py * H, n.rx * W
      );
      grd.addColorStop(0, n.color);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.ellipse(px * W, py * H, n.rx * W, n.ry * H, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawMoon() {
    const mx = moon.baseX * W + (mouse.x - 0.5) * -18;
    const my = moon.baseY * H + (mouse.y - 0.5) * -10;
    const glowPulse = 1 + 0.08 * Math.sin(t * 0.4);

    // outer glow
    let g = ctx.createRadialGradient(mx, my, moon.r * 0.8, mx, my, moon.r * 3.5 * glowPulse);
    g.addColorStop(0, 'rgba(200,220,255,0.18)');
    g.addColorStop(0.5, 'rgba(160,190,240,0.07)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(mx, my, moon.r * 3.5 * glowPulse, 0, Math.PI * 2);
    ctx.fill();

    // moon body
    let body = ctx.createRadialGradient(mx - moon.r*0.25, my - moon.r*0.25, moon.r*0.05, mx, my, moon.r);
    body.addColorStop(0, '#f4f8ff');
    body.addColorStop(0.45, '#d0e0f0');
    body.addColorStop(1, '#8aaac8');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(mx, my, moon.r, 0, Math.PI * 2);
    ctx.fill();

    // craters
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = 'rgba(100,140,180,0.5)';
    [[mx - moon.r*0.28, my - moon.r*0.18, 6],
     [mx + moon.r*0.22, my + moon.r*0.08, 8],
     [mx - moon.r*0.05, my + moon.r*0.30, 5]].forEach(([cx,cy,cr]) => {
      ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  function drawStars() {
    stars.forEach(s => {
      // subtle parallax
      const px = (s.x + (mouse.x - 0.5) * s.r * 0.015 * 0.5 + 1) % 1;
      const py = (s.y + s.speed * t + 1) % 1;
      const twinkle = 0.55 + 0.45 * Math.sin(t * s.twinkleSpeed + s.twinkleOffset);

      // glow for bigger stars
      if (s.r > 1.1) {
        const grd = ctx.createRadialGradient(px*W, py*H, 0, px*W, py*H, s.r * 3);
        grd.addColorStop(0, s.color.replace(')', `,${twinkle * 0.6})`).replace('hsl', 'hsla'));
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(px*W, py*H, s.r * 3, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.globalAlpha = twinkle;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(px*W, py*H, s.r, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  function drawShooters() {
    for (let i = shooters.length - 1; i >= 0; i--) {
      const s = shooters[i];
      const angle = Math.atan2(s.vy, s.vx);
      const tx = s.x - Math.cos(angle) * s.len;
      const ty = s.y - Math.sin(angle) * s.len;

      const grd = ctx.createLinearGradient(tx, ty, s.x, s.y);
      grd.addColorStop(0, 'rgba(255,255,255,0)');
      grd.addColorStop(1, `rgba(200,230,255,${s.alpha})`);

      ctx.strokeStyle = grd;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();

      s.x += s.vx;
      s.y += s.vy;
      s.alpha -= s.fade;
      if (s.alpha <= 0) shooters.splice(i, 1);
    }
  }

  function loop() {
    t++;
    ctx.clearRect(0, 0, W, H);

    // sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0,   '#020810');
    sky.addColorStop(0.4, '#050d1a');
    sky.addColorStop(1,   '#07101f');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    drawNebulae();
    drawMoon();
    drawStars();
    drawShooters();

    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
